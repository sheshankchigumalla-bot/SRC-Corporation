name: Repair dependency lockfile (SEO branch only)

on:
  push:
    branches: [feature/product-seo-ai-discovery]
    paths:
      - .github/workflows/repair-lockfile.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/product-seo-ai-discovery
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix: synchronize npm dependency lockfile"
            git push origin HEAD:feature/product-seo-ai-discovery
          fi
